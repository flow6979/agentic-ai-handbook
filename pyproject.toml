[project]
name = "agentkit"
version = "0.1.0"
description = "Framework-free agent toolkit used by every project in agentic-ai-handbook"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Section-specific extras. `pip install -e ".[all]"` sab install kar deta hai.
rag = ["pypdf>=4.0"]
web = []
comm = ["fastapi>=0.110", "uvicorn>=0.29", "mcp>=1.2"]
dev = ["pytest>=8"]
all = ["pypdf>=4.0", "fastapi>=0.110", "uvicorn>=0.29", "mcp>=1.2", "pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["common"]
include = ["agentkit*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["common/tests", "01-production-agent", "02-agentic-architectures", "03-web-agents", "04-rag", "05-agent-communication", "06-multi-agent-systems"]
norecursedirs = [".venv", ".git", "__pycache__"]
